name: Phase 2 - Render Clips

on:
  repository_dispatch:
    types: [phase2_render]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video URL'
        required: true
      clips_json:
        description: 'Pasted AI JSON'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg, ImageMagick, Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation fonts-dejavu
          # Fix ImageMagick security policy so MoviePy can draw text
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: pip install -r engine/requirements.txt

      - name: Render Video Clips
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url || github.event.client_payload.videoUrl }}
          CLIPS_JSON: ${{ github.event.inputs.clips_json || github.event.client_payload.clipsJson }}
        run: python engine/render_clips.py

      - name: Upload Edited Clips Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viral-clips
          path: workspace/output/
