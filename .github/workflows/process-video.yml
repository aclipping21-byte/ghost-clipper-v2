name: Ghost Clipper V2 Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Public URL of the uploaded video'
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          # Fix ImageMagick policy security block so MoviePy can render text
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          pip install --no-cache-dir -r engine/requirements.txt

      - name: Run Ghost Clipper Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          python engine/main.py

      - name: Upload Output Clips as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finished-clips
          path: output/*.mp4
          retention-days: 1
